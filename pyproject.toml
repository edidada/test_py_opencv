[tool.poetry]
name = "test-py-opencv"
version = "0.1.0"
description = "Test OpenCV Project"
authors = ["Your Name"]
readme = "README.md"
packages = [{ include = "test_py_opencv", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
numpy = ">=1.24.0,<2.0.0"
opencv-python = ">=4.8.0,<4.13.0"
moviepy = ">=1.0.3,<2.0.0"

[tool.poetry.scripts]
demo = "test_py_opencv.demo:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"